[project]
name = "confluence-mig"
version = "0.1.0"
description = "Confluence documentation migration and docs-as-code tooling"
requires-python = ">=3.11"
dependencies = [
    "atlassian-python-api>=3.41.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "md2cf>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
