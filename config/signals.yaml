# Structural signals for intent detection
# Used by taxonomy.py to detect what a page IS based on how it's written,
# not just keywords. Each signal is a regex matched against markdown content.
#
# weight: how strongly this signal suggests the category (1.0-6.0)
# Higher weight = more decisive signal

runbook:
  - pattern: "(?mi)^#{1,3}\\s*step\\s*\\d"
    signal: "numbered step headings"
    weight: 5.0
  - pattern: "(?mi)^#{1,3}\\s*prerequisites?\\b"
    signal: "prerequisites section"
    weight: 5.0
  - pattern: "(?mi)^#{1,3}\\s*rollback\\b"
    signal: "rollback section"
    weight: 6.0
  - pattern: "(?mi)^#{1,3}\\s*escalat"
    signal: "escalation section"
    weight: 3.5
  - pattern: "(?mi)^#{1,3}\\s*(troubleshoot|common\\s+(issues?|errors?|problems?))"
    signal: "troubleshooting section"
    weight: 4.0
  - pattern: "(?mi)(sudo|ssh|kubectl|docker run|systemctl|aws\\s|gcloud)\\s"
    signal: "CLI/ops commands"
    weight: 2.5
  - pattern: "(?m)^(1\\.\\s+.+\\n){3,}"
    signal: "numbered procedure steps"
    weight: 3.0
  - pattern: "(?mi)(if\\s+this\\s+fails|when\\s+the\\s+alert\\s+fires|in\\s+case\\s+of)"
    signal: "conditional ops language"
    weight: 3.0
  - pattern: "(?mi)(on[- ]?call|pager|incident\\s+commander|severity\\s+[0-9p])"
    signal: "incident response terms"
    weight: 3.5
  - pattern: "(?msi)^#{1,3}\\s*(steps?|prerequisites).*?^#{1,3}\\s*rollback"
    signal: "procedure with rollback pattern"
    weight: 6.0

architecture:
  - pattern: "(?mi)^#{1,3}\\s*(system\\s+)?overview\\b"
    signal: "overview heading"
    weight: 1.5
  - pattern: "(?mi)(\u2192|->|<->|communicates?\\s+with|calls?|depends?\\s+on|upstream|downstream)"
    signal: "dependency language"
    weight: 2.0
  - pattern: "(?mi)(service|component|module|layer|tier)\\s+(diagram|overview|architecture)"
    signal: "architecture terms"
    weight: 3.0
  - pattern: "(?mi)(trade-?off|we\\s+chose|we\\s+decided|alternative|option\\s+\\d|pro\\s*/\\s*con)"
    signal: "decision language"
    weight: 3.0
  - pattern: "(?mi)^#{1,3}\\s*(context|decision|consequences|status)\\s*$"
    signal: "ADR section headings"
    weight: 4.0
  - pattern: "(?mi)(data\\s*flow|sequence\\s*diagram|class\\s*diagram|er\\s*diagram|c4\\s*model)"
    signal: "diagram references"
    weight: 2.5
  - pattern: "(?mi)(accepted|proposed|deprecated|superseded)\\s*$"
    signal: "ADR status values"
    weight: 3.0
  - pattern: "(?mi)(module\\s+boundar|bounded\\s+context|domain\\s+(model|event|service))"
    signal: "modular architecture terms"
    weight: 3.5

api:
  - pattern: "(?m)`(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\\s+/"
    signal: "HTTP method + path"
    weight: 5.0
  - pattern: "(?mi)(request\\s+body|response\\s+body|query\\s+param|path\\s+param|header)"
    signal: "API param sections"
    weight: 3.0
  - pattern: "(?m)(2[0-9]{2}|4[0-9]{2}|5[0-9]{2})\\s+(OK|Created|Bad Request|Not Found|Unauthorized|Internal)"
    signal: "HTTP status codes"
    weight: 3.5
  - pattern: "(?mi)(bearer\\s+token|api[- ]?key|oauth|jwt|authorization\\s+header)"
    signal: "auth mechanism"
    weight: 2.5
  - pattern: "(?mi)(swagger|openapi|endpoint|rate[- ]?limit)"
    signal: "API doc terms"
    weight: 2.0
  - pattern: "(?m)```json\\s*\\n\\s*\\{"
    signal: "JSON code blocks"
    weight: 1.5

onboarding:
  - pattern: "(?mi)^#{1,3}\\s*(getting\\s+started|quick\\s*start|first\\s+steps?)"
    signal: "getting started heading"
    weight: 4.0
  - pattern: "(?mi)(clone\\s+the\\s+repo|git\\s+clone|fork\\s+(the|this))"
    signal: "repo clone instructions"
    weight: 3.5
  - pattern: "(?mi)(install\\s+(dependencies|requirements|packages)|pip\\s+install|npm\\s+install|brew\\s+install)"
    signal: "dependency install"
    weight: 3.0
  - pattern: "(?mi)(local\\s+(development|setup|env)|dev\\s+environment)"
    signal: "local dev setup"
    weight: 3.5
  - pattern: "(?mi)(new\\s+(developer|hire|team\\s+member|joiner)|first\\s+(day|week))"
    signal: "new hire language"
    weight: 4.0
  - pattern: "(?mi)(PR\\s+(process|workflow|review)|branch(ing)?\\s+(strategy|model|convention))"
    signal: "dev workflow terms"
    weight: 2.5
  - pattern: "(?mi)(coding\\s+(standards?|conventions?|style)|linting|formatter)"
    signal: "coding standards"
    weight: 2.5

infrastructure:
  - pattern: "(?mi)(vpc|subnet|security\\s+group|load\\s+balancer|auto[- ]?scaling|cdn)"
    signal: "cloud networking terms"
    weight: 3.0
  - pattern: "(?mi)(terraform|cloudformation|pulumi|ansible|helm\\s+chart)"
    signal: "IaC tools"
    weight: 3.5
  - pattern: "(?mi)(ci/?cd|pipeline|github\\s+actions?|jenkins|circle\\s*ci|gitlab\\s+ci|buildkite)"
    signal: "CI/CD terms"
    weight: 3.0
  - pattern: "(?mi)(prometheus|grafana|datadog|cloudwatch|new\\s*relic|pagerduty|opsgenie)"
    signal: "monitoring tools"
    weight: 2.5
  - pattern: "(?mi)(s3|rds|ec2|ecs|eks|lambda|dynamodb|sqs|sns|kinesis)"
    signal: "AWS services"
    weight: 2.0
  - pattern: "(?mi)(dockerfile|docker[- ]?compose|k8s|kubernetes|pod|deployment|ingress)"
    signal: "container/k8s terms"
    weight: 2.0
  - pattern: "(?mi)^#{1,3}\\s*(infrastructure|cloud\\s+architecture|platform\\s+overview)"
    signal: "infra section headings"
    weight: 4.0
  - pattern: "(?mi)(\\d+\\s+(cluster|node|instance|replica|region)s?\\b)"
    signal: "infra scale/topology"
    weight: 3.0

product:
  - pattern: "(?mi)^#{1,3}\\s*(user\\s+stor(y|ies)|acceptance\\s+criteria)"
    signal: "requirement sections"
    weight: 5.0
  - pattern: "(?mi)(as\\s+a\\s+.{3,30},?\\s+I\\s+want)"
    signal: "user story format"
    weight: 5.0
  - pattern: "(?mi)(given\\s+.{3,40}\\s+when\\s+.{3,40}\\s+then)"
    signal: "BDD scenario format"
    weight: 4.0
  - pattern: "(?mi)(MVP|minimum\\s+viable|feature\\s+flag|release\\s+plan|roadmap)"
    signal: "product planning terms"
    weight: 3.0
  - pattern: "(?mi)(stakeholder|customer\\s+(need|feedback|request)|business\\s+requirement)"
    signal: "stakeholder language"
    weight: 3.0
  - pattern: "(?mi)(in[- ]scope|out[- ]of[- ]scope|scope)"
    signal: "scope sections"
    weight: 2.0
  - pattern: "(?mi)(priority|must[- ]have|should[- ]have|could[- ]have|won'?t[- ]have|MoSCoW)"
    signal: "prioritization language"
    weight: 3.0
